name: Linux daemon build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/linux-daemon.yml
      - package.json
      - package-lock.json
      - scripts/build-daemon.mjs
      - scripts/package-daemon.mjs
      - scripts/daemon-supervisor.mjs
      - src/**

permissions:
  contents: read

jobs:
  linux-daemon:
    name: Linux x64 daemon package
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Build distributable package
        run: npm run daemon:package

      - name: Check packaged binary
        run: |
          artifacts/daemon/hive-linux-x64 help
          tar -tzf artifacts/daemon/Hive-daemon-linux-x64.tar.gz
          (cd artifacts/daemon && sha256sum -c Hive-daemon-linux-x64.tar.gz.sha256)

      - name: Upload Linux daemon package
        uses: actions/upload-artifact@v4
        with:
          name: Hive-daemon-linux-x64
          path: |
            artifacts/daemon/Hive-daemon-linux-x64.tar.gz
            artifacts/daemon/Hive-daemon-linux-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Linux daemon release assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: linux-daemon
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Linux daemon package
        uses: actions/download-artifact@v4
        with:
          name: Hive-daemon-linux-x64
          path: release-assets

      - name: Attach package to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
