name: Build and publish release assets

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-assets:
    name: Build Linux, Android, and daemon downloads
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Install workspace dependencies
        run: npm ci

      - name: Build Linux desktop installer
        run: |
          npm run desktop:build
          test -f apps/desktop/artifacts/linux-x64-Hive-Setup.tar.gz
          mkdir -p release-assets
          cp apps/desktop/artifacts/linux-x64-Hive-Setup.tar.gz release-assets/Hive-linux-x64.tar.gz

      - name: Build Android APK
        run: |
          npm run android:build
          test -f artifacts/android/Hive-android-debug.apk
          cp artifacts/android/Hive-android-debug.apk release-assets/Hive-android-debug.apk

      - name: Build standalone Linux daemon
        run: |
          npm run daemon:package
          artifacts/daemon/hive-linux-x64 help
          tar -tzf artifacts/daemon/Hive-daemon-linux-x64.tar.gz
          (cd artifacts/daemon && sha256sum -c Hive-daemon-linux-x64.tar.gz.sha256)
          cp artifacts/daemon/Hive-daemon-linux-x64.tar.gz release-assets/
          cp artifacts/daemon/Hive-daemon-linux-x64.tar.gz.sha256 release-assets/

      - name: Create and verify checksums
        run: |
          cd release-assets
          sha256sum Hive-linux-x64.tar.gz > Hive-linux-x64.tar.gz.sha256
          sha256sum Hive-android-debug.apk > Hive-android-debug.apk.sha256
          tar -tzf Hive-linux-x64.tar.gz | grep -qx './installer'
          unzip -tq Hive-android-debug.apk
          sha256sum -c Hive-linux-x64.tar.gz.sha256
          sha256sum -c Hive-android-debug.apk.sha256
          sha256sum -c Hive-daemon-linux-x64.tar.gz.sha256

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: Hive-release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Attach downloads to GitHub Release
    needs: build-assets
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: Hive-release-assets
          path: release-assets

      - name: Create release and attach downloads
        uses: softprops/action-gh-release@v2
        with:
          name: Hive ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
